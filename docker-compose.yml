# Local stack: API + frontend. Neon (Postgres) and Pinecone stay remote — they
# are the systems of record and there is no local stand-in, so backend/app/.env
# must point at a real project.
#
#   docker compose up --build
#   frontend -> http://localhost:5173,  API -> http://localhost:8000
#
# Single API service (no worker queue). env_file injects the real credentials at
# runtime; they are never baked into an image (see .dockerignore).

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/app/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the bundle at build time (Vite), so changing this needs a
        # rebuild, not a restart. localhost works because the browser resolves
        # it, not the container.
        VITE_API_BASE_URL: "http://localhost:8000/api"
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
