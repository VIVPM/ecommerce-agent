server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: anything that isn't a real file returns index.html, so a
    # refresh on a client-side route doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted filenames, so caching forever is safe. index.html isn't
    # cached — it points at the current fingerprints.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
