server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: the React app owns the URL space, so any path that isn't a real
    # file returns index.html rather than nginx's 404 — otherwise a refresh on a
    # client-side route 404s even though the route exists.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so a changed file is a changed URL and
    # caching forever is safe. index.html (below) is not cached — it's what points
    # at the current fingerprints.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
